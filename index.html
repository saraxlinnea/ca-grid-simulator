        padding-right: 1rem;
      }
    }

      align-items: baseline;

      font-size: 0.625rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-primary);
    }

      display: flex;
      flex-direction: column;
      border: 1px solid var(--rule);
      background: #fff;
      min-height: 0;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }
    .facility-type-card[data-active="true"] {
      border-color: var(--accent);
      box-shadow: inset 3px 0 0 var(--pacific);
      transform: translateY(-1px);
    }
    @media (prefers-reduced-motion: reduce) {
      .facility-type-card {
        transition: none;
      }
      .facility-type-card[data-active="true"] {
        transform: none;
      }
    }
    .facility-type-card > button.select-type {
      text-align: left;
      padding: 0.85rem 1rem;
      width: 100%;
      background: transparent;
      border: 0;
      cursor: pointer;
      flex: 1;
    }
    .facility-type-card > button.select-type:hover {
      background: var(--fog);
    }
    .facility-types-info {
      border: 1px solid var(--rule);
      background: #fff;
    }
    .facility-types-info > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.55rem 1rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }
    .facility-types-info > summary::-webkit-details-marker {
      display: none;
    }
    .facility-types-info > summary .caret {
      color: var(--accent);
      font-size: 0.5625rem;
      transition: transform 0.15s ease;
    }
    .facility-types-info[open] > summary .caret {
      transform: rotate(180deg);
    }
    .facility-types-info-body {
      padding: 0 1rem 0.85rem;
      border-top: 1px solid var(--rule);
    }

      .sticky-scorecard {
        transition: none;
      }
      .facility-types-info > summary .caret {
        transition: none;
      }
    }

      .metric-row {
        grid-template-columns: 1fr;
      }
      .metric-row > div {
        border-right: none;
        border-bottom: 1px solid var(--rule);
      }
      .metric-row > div:last-child {
        border-bottom: none;
      }
    }
    a {
      transition: color 0.2s ease;
    }
    @media print {
      @page { margin: 0.75in; }
      .no-print { display: none !important; }

      .photo-band::after,
      .header-sheen::before,
      .header-sheen::after { display: none !important; }
    }

      'Direct-to-Chip Liquid': 'liquid',
    };

      open: 'Evaporative Open-Loop',
      closed: 'Closed-Loop Air Cooled',
      liquid: 'Direct-to-Chip Liquid',
    };

    function parseScenarioFromSearch(search) {
      const raw = search.startsWith('?') ? search.slice(1) : search;
      const params = new URLSearchParams(raw);
      const defaults = baselines.industryContext.defaultInputs;
      const presets = [
        ...baselines.industryContext.scenarioPresets,
        baselines.industryContext.stressTestPreset,
      ];

      let tab = params.get('tab');
      if (tab !== 'plan' && tab !== 'how-it-works' && tab !== 'background') tab = 'plan';

      const preset = presets.find((entry) => entry.id === params.get('preset'));
      if (preset) {
        return {
          tab,
          mw: preset.mw,
          utility: preset.utilityCode,
          cooling: preset.coolingType,
          clean: preset.prefundCleanEnergy,
        };
      }

      const mwRaw = Number.parseFloat(params.get('mw'));
      const mw = Number.isFinite(mwRaw)
        ? Math.min(MW_SLIDER_MAX, Math.max(MW_SLIDER_MIN, mwRaw))
        : defaults.megawatts;
      const utilityParam = params.get('utility');
      const utility = UTILITY_CODES.includes(utilityParam)
        ? utilityParam
        : defaults.utilityCode;
      const cooling = CODE_TO_COOLING[params.get('cooling')] || defaults.coolingType;
      const cleanParam = params.get('clean');
      let clean = defaults.prefundCleanEnergy;
      if (cleanParam === '0') clean = false;
      if (cleanParam === '1') clean = true;

      return { tab, mw, utility, cooling, clean };
    }

    function buildScenarioSearch({ tab, mw, utility, cooling, clean, presetId }) {
      const params = new URLSearchParams();
      if (tab && tab !== 'plan') params.set('tab', tab);
      if (presetId) {
        params.set('preset', presetId);
      } else {
        const mwStr = mw % 1 === 0 ? String(mw) : mw.toFixed(1);
        params.set('mw', mwStr);
        params.set('utility', utility);
        params.set('cooling', COOLING_TO_CODE[cooling] || 'closed');
        params.set('clean', clean ? '1' : '0');
      }
      const query = params.toString();
      return query ? `?${query}` : '';

    function calculateSB886Tariff(megawatts, utilityCode) {
      const utility = baselines.utilityBaselines[utilityCode];
      const rules = baselines.legislativeTriggers.SB886;
      if (!utility) return null;

      const isTriggered = megawatts >= rules.transmissionServiceThreshold_MW;
      const totalGridUpgradeCost = megawatts * utility.estimatedGridUpgradeCostPerMW;
      const developerShare = isTriggered
        ? totalGridUpgradeCost
        : totalGridUpgradeCost * rules.subThresholdDeveloperShare;
      const ratepayerShare = totalGridUpgradeCost - developerShare;
      const annualPpaCost = isTriggered
        ? megawatts * (rules.minZeroCarbonLoadMatchPercent / 100) * rules.assumedAnnualPpaCostPerMatchedMW
        : 0;
      const total15YearPpaCost = annualPpaCost * rules.minZeroCarbonContractYears;

      return { isTriggered, totalGridUpgradeCost, developerShare, ratepayerShare, annualPpaCost, total15YearPpaCost };
    }

    function calculateCEQATimeline(coolingType, uses100PercentCleanEnergy, prefundsGridUpgrades) {
      const rules = baselines.legislativeTriggers.SB887;
      let timelineMonths = rules.standardCeqaLitigationMonths;
      let status = 'Standard CEQA review timeline (modeled baseline)';
      let statusColor = 'text-amber-700';
      let qualifiesForEldp = false;
      const avoidsPotableWater = coolingType !== 'Evaporative Open-Loop';

      if (avoidsPotableWater && uses100PercentCleanEnergy && prefundsGridUpgrades) {
        timelineMonths = rules.eldpAcceleratedReviewMonths;
        status = 'Shorter timeline in this scenario when water, clean power, and size conditions align';
        statusColor = 'text-emerald-700';
        qualifiesForEldp = true;
      } else if (!avoidsPotableWater) {
        timelineMonths += rules.evaporativeCoolingPenaltyMonths;
        status = 'Longer timeline in this scenario: open-loop evaporative cooling adds 12 months';
        statusColor = 'text-rose-700';
      }

      return { timelineMonths, status, statusColor, qualifiesForEldp };
    }

    function calculateAB1577Burden(megawatts) {
      const kilowatts = megawatts * 1000;
      const threshold = baselines.legislativeTriggers.AB1577.minThreshold_kW;
      const isTriggered = kilowatts >= threshold;
      return {
        isTriggered,
        reportingCadence: isTriggered ? 'Modeled: monthly disclosure' : 'Below modeled threshold',
        metricsRequired: isTriggered ? baselines.legislativeTriggers.AB1577.mandatoryMetrics : [],
      };
    }

    function calculateAnnualDebtService(principal, annualRate, termYears) {
      if (principal <= 0 || termYears <= 0) return 0;
      if (annualRate <= 0) return principal / termYears;
      const factor = Math.pow(1 + annualRate, termYears);
      return principal * (annualRate * factor) / (factor - 1);
    }

    function npvAtDiscountRate(amounts, discountRate) {
      let npv = 0;
      for (let t = 0; t < amounts.length; t++) {
        npv += amounts[t] / Math.pow(1 + discountRate, t + 1);
      }
      return npv;
    }

    function calculateIRRFromAmounts(amounts, guess = 0.1) {
      if (!amounts.length) return null;
      const npv = (rate) => {
        let total = 0;
        for (let t = 0; t < amounts.length; t++) {
          total += amounts[t] / Math.pow(1 + rate, t + 1);
        }
        return total;
      };
      let rate = guess;
      for (let iter = 0; iter < 80; iter++) {
        const value = npv(rate);
        if (Math.abs(value) < 1e-4) return rate;
        let derivative = 0;
        for (let t = 0; t < amounts.length; t++) {
          derivative -= (t + 1) * amounts[t] / Math.pow(1 + rate, t + 2);
        }
        if (Math.abs(derivative) < 1e-12) break;
        const next = rate - value / derivative;
        if (!Number.isFinite(next)) break;
        rate = Math.max(-0.99, Math.min(5, next));
      }
      let lo = -0.5;
      let hi = 1.5;
      const nLo = npv(lo);
      const nHi = npv(hi);
      if (nLo * nHi > 0) return null;
      for (let i = 0; i < 80; i++) {
        const mid = (lo + hi) / 2;
        const nMid = npv(mid);
        if (Math.abs(nMid) < 1e-4) return mid;
        if (nLo * nMid <= 0) {
          hi = mid;
        } else {
          lo = mid;
        }
      }
      return (lo + hi) / 2;
    }

    function applyProjectFinancing(cashFlows, financing, totalUpfront, permitYears, constructionYears) {
      const useFinancing = financing.includeFinancing && financing.debtShare > 0;
      const loanStartYear = permitYears + constructionYears;
      const loanPrincipal = useFinancing ? totalUpfront * financing.debtShare : 0;
      const annualDebtService = useFinancing
        ? calculateAnnualDebtService(loanPrincipal, financing.interestRate, financing.loanTermYears)
        : 0;
      const loanEndYear = loanStartYear + financing.loanTermYears - 1;

      let minDscr = null;
      let worstDscrYear = null;

      cashFlows.forEach((row) => {
        const operatingCashFlow = row.annualRevenue - row.annualOperatingCost;
        let debtService = 0;
        let debtProceeds = 0;
        if (useFinancing && row.year >= loanStartYear && row.year <= loanEndYear) {
          debtService = annualDebtService;
        }
        if (useFinancing && row.year === loanStartYear) {
          debtProceeds = loanPrincipal;
        }
        const leveredNetCashFlow = row.netCashFlow + debtProceeds - debtService;
        const dscr = debtService > 0 ? operatingCashFlow / debtService : null;

        if (dscr != null && (minDscr == null || dscr < minDscr)) {
          minDscr = dscr;
          worstDscrYear = row.year;
        }

        row.operatingCashFlow = operatingCashFlow;
        row.debtService = debtService;
        row.debtProceeds = debtProceeds;
        row.leveredNetCashFlow = leveredNetCashFlow;
        row.dscr = dscr;
      });

      const unleveredAmounts = cashFlows.map((row) => row.netCashFlow);
      const leveredAmounts = cashFlows.map((row) => row.leveredNetCashFlow);
      const discountRate = financing.discountRate || 0.1;

      return {
        loanStartYear,
        loanPrincipal,
        annualDebtService,
        loanTermYears: financing.loanTermYears,
        debtShare: financing.debtShare,
        interestRate: financing.interestRate,
        includeFinancing: financing.includeFinancing,
        unleveredIrr: calculateIRRFromAmounts(unleveredAmounts),
        leveredIrr: useFinancing ? calculateIRRFromAmounts(leveredAmounts) : null,
        npvUnlevered: npvAtDiscountRate(unleveredAmounts, discountRate),
        npvLevered: useFinancing ? npvAtDiscountRate(leveredAmounts, discountRate) : null,
        minDscr,
        worstDscrYear,
      };
    }

    function buildProjectEconomics(megawatts, assumptions, context) {
      const {
        gridUpgradeDeveloperShare = 0,
        annualCleanEnergyCost = 0,
        timelineMonths = null,
      } = context || {};

      const hoursPerYear = 8760;
      const horizon = assumptions.analysisHorizonYears || 15;
      const constructionYears = Math.max(1, assumptions.constructionYears || 2);
      const rampYears = Math.max(1, assumptions.rampYears || 3);
      const fastPathMonths = assumptions.fastPathBaselineMonths || 12;
      const carryingCostRate = assumptions.carryingCostRate || 0;
      const opexPerMWYear = assumptions.opexPerMWYear || 0;

      const totalCapex = megawatts * assumptions.capexPerMW;
      const gridUpgrade = gridUpgradeDeveloperShare || 0;
      const capexPerYear = totalCapex / constructionYears;

      const months = timelineMonths != null ? timelineMonths : fastPathMonths;
      const permitYears = Math.ceil(months / 12);
      const extraPermittingMonths = Math.max(0, months - fastPathMonths);
      const permittingDelayCost = extraPermittingMonths > 0
        ? (totalCapex + gridUpgrade) * carryingCostRate * (extraPermittingMonths / 12)
        : 0;

      const cashFlows = [];
      let cumulativeNet = 0;
      let schedulePaybackYear = null;

      for (let year = 1; year <= horizon; year++) {
        let phase = 'permitting';
        let mwOnline = 0;
        let occupancy = 0;
        let capexOutflow = 0;
        let gridOutflow = 0;
        let delayCarryOutflow = 0;

        if (year > permitYears) {
          const buildYear = year - permitYears;
          if (buildYear <= constructionYears) {
            phase = 'construction';
            mwOnline = (buildYear / constructionYears) * megawatts;
            occupancy = Math.min(1, buildYear / rampYears);
            capexOutflow = capexPerYear;
            if (buildYear === 1 && permittingDelayCost > 0) delayCarryOutflow = permittingDelayCost;
            if (buildYear === constructionYears) gridOutflow = gridUpgrade;
          } else {
            phase = 'operations';
            mwOnline = megawatts;
            const yearsSinceBuildStart = buildYear;
            occupancy = Math.min(1, yearsSinceBuildStart / rampYears);
          }
        }

        const effectiveMW = mwOnline * occupancy;
        const annualMWh = effectiveMW * hoursPerYear * assumptions.loadFactor * assumptions.pue;
        const annualEnergyCost = annualMWh * assumptions.energyPricePerMWh;
        const annualOpex = mwOnline * opexPerMWYear;
        const ppaFraction = megawatts > 0 ? mwOnline / megawatts : 0;
        const annualPpa = annualCleanEnergyCost > 0 ? annualCleanEnergyCost * ppaFraction : 0;
        const annualOperatingCost = annualEnergyCost + annualOpex + annualPpa;
        const annualRevenue = assumptions.includeRevenue && effectiveMW > 0
          ? effectiveMW * 1000 * assumptions.revenuePerKWMonth * 12
          : 0;
        const netCashFlow = annualRevenue - annualOperatingCost - capexOutflow - gridOutflow - delayCarryOutflow;

        cumulativeNet += netCashFlow;
        if (schedulePaybackYear == null && cumulativeNet >= 0 && (capexOutflow > 0 || gridOutflow > 0 || annualRevenue > 0)) {
          schedulePaybackYear = year;
        }

        cashFlows.push({
          year,
          phase,
          mwOnline,
          occupancy,
          effectiveMW,
          capexOutflow,
          gridOutflow,
          delayCarryOutflow,
          annualRevenue,
          annualEnergyCost,
          annualOpex,
          annualPpa,
          annualOperatingCost,
          netCashFlow,
          cumulativeNet,
        });
      }

      const stabilizedMWh = megawatts * hoursPerYear * assumptions.loadFactor * assumptions.pue;
      const stabilizedEnergy = stabilizedMWh * assumptions.energyPricePerMWh;
      const stabilizedOpex = megawatts * opexPerMWYear;
      const stabilizedPpa = annualCleanEnergyCost || 0;
      const stabilizedOpCost = stabilizedEnergy + stabilizedOpex + stabilizedPpa;
      const stabilizedRevenue = assumptions.includeRevenue
        ? megawatts * 1000 * assumptions.revenuePerKWMonth * 12
        : null;
      const stabilizedNet = stabilizedRevenue != null ? stabilizedRevenue - stabilizedOpCost : null;
      const totalUpfront = totalCapex + gridUpgrade + permittingDelayCost;
      const simplePaybackYears = stabilizedNet != null && stabilizedNet > 0 ? totalUpfront / stabilizedNet : null;

      const financing = {
        includeFinancing: assumptions.includeFinancing !== false,
        debtShare: assumptions.debtShare ?? 0,
        interestRate: assumptions.interestRate ?? 0,
        loanTermYears: assumptions.loanTermYears ?? 10,
        discountRate: assumptions.discountRate ?? 0.1,
      };
      const financeResults = applyProjectFinancing(cashFlows, financing, totalUpfront, permitYears, constructionYears);

      let cumulativeLevered = 0;
      cashFlows.forEach((row) => {
        cumulativeLevered += row.leveredNetCashFlow;
        row.cumulativeLevered = cumulativeLevered;
      });

      return {
        capex: totalCapex,
        annualMWh: stabilizedMWh,
        annualEnergyCost: stabilizedEnergy,
        annualOpex: stabilizedOpex,
        annualCleanEnergyCost: stabilizedPpa,
        annualRevenue: stabilizedRevenue,
        gridUpgrade,
        permittingDelayCost,
        extraPermittingMonths,
        totalUpfront,
        annualOperatingCost: stabilizedOpCost,
        annualNet: stabilizedNet,
        simplePaybackYears,
        schedulePaybackYear,
        cashFlows,
        permitYears,
        constructionYears,
        rampYears,
        horizon,
        ...financeResults,
      };
    }

    function getFinanceMetric(econ, metric, useLevered) {
      if (metric === 'npv') {
        if (useLevered && econ.npvLevered != null) return econ.npvLevered;
        return econ.npvUnlevered;
      }
      if (useLevered && econ.leveredIrr != null) return econ.leveredIrr;
      return econ.unleveredIrr;
    }

    function computeSensitivityAnalysis(megawatts, baseAssumptions, baseContext, options) {
      const { metric = 'irr', useLevered = true } = options;
      const baseEcon = buildProjectEconomics(megawatts, baseAssumptions, baseContext);
      const baseValue = getFinanceMetric(baseEcon, metric, useLevered);
      if (baseValue == null) return { baseValue: null, rows: [], metric, useLevered };

      const timelineBase = baseContext.timelineMonths ?? baseAssumptions.fastPathBaselineMonths ?? 12;
      const scenarios = [
        {
          key: 'capexPerMW',
          label: 'CapEx per MW',
          lowNote: '−20%',
          highNote: '+20%',
          lowAssumptions: { ...baseAssumptions, capexPerMW: baseAssumptions.capexPerMW * 0.8 },
          highAssumptions: { ...baseAssumptions, capexPerMW: baseAssumptions.capexPerMW * 1.2 },
        },
        {
          key: 'revenuePerKWMonth',
          label: 'Colo revenue',
          lowNote: '−25%',
          highNote: '+25%',
          lowAssumptions: { ...baseAssumptions, revenuePerKWMonth: baseAssumptions.revenuePerKWMonth * 0.75 },
          highAssumptions: { ...baseAssumptions, revenuePerKWMonth: baseAssumptions.revenuePerKWMonth * 1.25 },
        },
        {
          key: 'energyPricePerMWh',
          label: 'Energy price',
          lowNote: '−30%',
          highNote: '+30%',
          lowAssumptions: { ...baseAssumptions, energyPricePerMWh: baseAssumptions.energyPricePerMWh * 0.7 },
          highAssumptions: { ...baseAssumptions, energyPricePerMWh: Math.min(150, baseAssumptions.energyPricePerMWh * 1.3) },
        },
        {
          key: 'loadFactor',
          label: 'Load factor',
          lowNote: '−15%',
          highNote: '+15%',
          lowAssumptions: { ...baseAssumptions, loadFactor: Math.max(0.5, baseAssumptions.loadFactor * 0.85) },
          highAssumptions: { ...baseAssumptions, loadFactor: Math.min(1, baseAssumptions.loadFactor * 1.15) },
        },
        {
          key: 'rampYears',
          label: 'Lease-up ramp',
          lowNote: '−1 yr',
          highNote: '+1 yr',
          lowAssumptions: { ...baseAssumptions, rampYears: Math.max(1, baseAssumptions.rampYears - 1) },
          highAssumptions: { ...baseAssumptions, rampYears: Math.min(5, baseAssumptions.rampYears + 1) },
        },
        {
          key: 'permitting',
          label: 'Permitting time',
          lowNote: '−12 mo',
          highNote: '+12 mo',
          lowContext: { ...baseContext, timelineMonths: Math.max(12, timelineBase - 12) },
          highContext: { ...baseContext, timelineMonths: timelineBase + 12 },
        },
        {
          key: 'gridUpgrade',
          label: 'Grid upgrade cost',
          lowNote: '−30%',
          highNote: '+30%',
          lowContext: { ...baseContext, gridUpgradeDeveloperShare: (baseContext.gridUpgradeDeveloperShare || 0) * 0.7 },
          highContext: { ...baseContext, gridUpgradeDeveloperShare: (baseContext.gridUpgradeDeveloperShare || 0) * 1.3 },
        },
      ];

      if (useLevered && baseAssumptions.debtShare > 0 && baseAssumptions.includeFinancing !== false) {
        scenarios.push({
          key: 'interestRate',
          label: 'Interest rate',
          lowNote: '−2 pts',
          highNote: '+2 pts',
          lowAssumptions: { ...baseAssumptions, interestRate: Math.max(0.04, baseAssumptions.interestRate - 0.02) },
          highAssumptions: { ...baseAssumptions, interestRate: Math.min(0.12, baseAssumptions.interestRate + 0.02) },
        });
      }

      if ((baseContext.annualCleanEnergyCost || 0) > 0) {
        scenarios.push({
          key: 'ppa',
          label: 'Clean-energy PPA',
          lowNote: '−20%',
          highNote: '+20%',
          lowContext: { ...baseContext, annualCleanEnergyCost: baseContext.annualCleanEnergyCost * 0.8 },
          highContext: { ...baseContext, annualCleanEnergyCost: baseContext.annualCleanEnergyCost * 1.2 },
        });
      }

      const rows = scenarios.map((scenario) => {
        const lowEcon = buildProjectEconomics(
          megawatts,
          scenario.lowAssumptions || baseAssumptions,
          scenario.lowContext || baseContext
        );
        const highEcon = buildProjectEconomics(
          megawatts,
          scenario.highAssumptions || baseAssumptions,
          scenario.highContext || baseContext
        );
        const low = getFinanceMetric(lowEcon, metric, useLevered);
        const high = getFinanceMetric(highEcon, metric, useLevered);
        return {
          key: scenario.key,
          label: scenario.label,
          lowNote: scenario.lowNote,
          highNote: scenario.highNote,
          low,
          high,
          spread: low != null && high != null ? Math.abs(high - low) : 0,
        };
      }).filter((row) => row.low != null && row.high != null)
        .sort((a, b) => b.spread - a.spread);

      return { baseValue, rows, metric, useLevered };
    }

    function calculateFacilityEconomics(megawatts, assumptions, context) {
      return buildProjectEconomics(megawatts, assumptions, context);
    }

    function getEnergyScale(megawatts, loadFactor, pue) {
      const annualMWh = megawatts * 8760 * loadFactor * pue;
      const homeKWh = baselines.industryContext.energyPriceBenchmarks.avgHomeKWhPerYear;
      const homesEquivalent = homeKWh > 0 ? (annualMWh * 1000) / homeKWh : 0;
      const usTotalMWh = baselines.usElectricity.historical.slice(-1)[0].billionKWh * 1e6;
      const usSharePercent = usTotalMWh > 0 ? (annualMWh / usTotalMWh) * 100 : 0;
      return { annualMWh, homesEquivalent, usSharePercent };
    }

    // Illustrative site footprint range (acres/MW). Not geometry- or zoning-specific.
    const LAND_ACRES_PER_MW = { low: 0.8, high: 2.0 };

    function estimateLandAcres(megawatts) {
      const mw = Number(megawatts) || 0;
      return {
        low: mw * LAND_ACRES_PER_MW.low,
        high: mw * LAND_ACRES_PER_MW.high,
      };
    }

    // Cooling → relative water intensity band (WUE framing). Not site gallons.
    function estimateWaterBand(coolingType) {
      if (coolingType === 'Evaporative Open-Loop') {
        return {
          level: 'high',
          label: 'High',
          note: 'Open-loop evaporative cooling typically has the highest on-site water use among these options.',
        };
      }
      if (coolingType === 'Direct-to-Chip Liquid') {
        return {
          level: 'medium',
          label: 'Medium',
          note: 'Chip liquid loops cut evaporative loss, but heat rejection and site loops can still use water.',
        };
      }
      return {
        level: 'low',
        label: 'Low',
        note: 'Closed-loop air cooling usually uses the least on-site water; electricity use for fans/chillers rises instead.',
      };
    }

    function buildCompareSnapshot(mw, utilityCode, coolingType, prefundCleanEnergy, loadFactor, pue) {
      const sb886 = calculateSB886Tariff(mw, utilityCode);
      const ceqa = calculateCEQATimeline(coolingType, prefundCleanEnergy, mw >= 25);
      const ab1577 = calculateAB1577Burden(mw);
      const energy = getEnergyScale(mw, loadFactor, pue);
      const land = estimateLandAcres(mw);
      const water = estimateWaterBand(coolingType);
      return {
        mw,
        utilityCode,
        coolingType,
        prefundCleanEnergy,
        developerShare: sb886?.developerShare ?? null,
        timelineMonths: ceqa.timelineMonths,
        disclosureLabel: ab1577.isTriggered ? 'Monthly reporting' : 'No reporting',
        gwh: energy.annualMWh / 1000,
        landLow: land.low,
        landHigh: land.high,
        waterLevel: water.level,
        waterLabel: water.label,
      };
    }

    function buildWorkedExample(mw, utilityCode, coolingType, prefundCleanEnergy, econAssumptions) {
      const utility = baselines.utilityBaselines[utilityCode];
      const sb886 = calculateSB886Tariff(mw, utilityCode);
      const ceqa = calculateCEQATimeline(coolingType, prefundCleanEnergy, mw >= 25);
      const ab1577 = calculateAB1577Burden(mw);
      const econ = calculateFacilityEconomics(mw, econAssumptions, { gridUpgradeDeveloperShare: sb886?.developerShare, annualCleanEnergyCost: sb886?.annualPpaCost, timelineMonths: ceqa?.timelineMonths });
      const energy = getEnergyScale(mw, econAssumptions.loadFactor, econAssumptions.pue);
      const rules886 = baselines.legislativeTriggers.SB886;
      const rules887 = baselines.legislativeTriggers.SB887;

      return [

                const active = value === region.id;
                return (
                  <path
                    key={region.id}
                    className="territory"
                    d={region.path}
                    fill={region.color}
                    fillRule="evenodd"
                    data-utility={region.id}
                    data-active={active ? 'true' : 'false'}
                    tabIndex={0}
                    role="button"
                    aria-pressed={active}
                    aria-label={`${region.title}, ${region.salesTWh} terawatt-hours retail sales in ${region.salesYear}`}
                    onClick={() => onChange(region.id)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        onChange(region.id);
                      }
                    }}
                  />
                );
              })}
              <path className="ca-outline" d={CA_OUTLINE_PATH} />
            </svg>
            <p className="utility-map-selected">

              {' · '}
              {selected.salesTWh} TWh ({selected.salesYear})

          </div>
          <div className="utility-map-legend" role="group" aria-label="Utility territory">
            {UTILITY_MAP_REGIONS.map((region) => (
              <button
                key={region.id}
                type="button"
                data-active={value === region.id ? 'true' : 'false'}
                onClick={() => onChange(region.id)}
              >
                <span className="swatch" style={{ background: region.color }} aria-hidden="true" />
                <span className="legend-main">

    function MwThresholdSlider({ value, onChange }) {
      const t1 = mwSliderPercent(0.5);
      const t2 = mwSliderPercent(25);
      const zone = value < 0.5 ? 'below' : value < 25 ? 'disclosure' : 'full';
      return (
        <div>
          <div
            className="mw-slider-wrap"
            style={{ '--mw-t1': `${t1}%`, '--mw-t2': `${t2}%` }}
          >
            <div
              className="mw-slider-tick"
              style={{ left: `${t1}%` }}
              title="Disclosure threshold"
            >
              <span>0.5</span>
            </div>
            <div
              className="mw-slider-tick"
              style={{ left: `${t2}%` }}
              title="Full developer share threshold"
            >
              <span>25</span>
            </div>
            <div className="mw-slider-bands" aria-hidden="true" />
            <input
              type="range"
              min={MW_SLIDER_MIN}
              max={MW_SLIDER_MAX}
              step="0.1"
              value={value}
              onChange={(e) => onChange(Number(e.target.value))}
              aria-valuemin={MW_SLIDER_MIN}
              aria-valuemax={MW_SLIDER_MAX}
              aria-valuenow={value}
              aria-label="Facility size in megawatts"
            />
          </div>
          <div className="flex justify-between text-[10px] text-fog-700 font-mono mt-1">

            <span>{MW_SLIDER_MAX} MW</span>

    function CumulativeCashFlowChart({ cashFlows, showFinancing, formatCurrency }) {
      if (!cashFlows || cashFlows.length === 0) return null;
      const width = 480;
      const height = 160;
      const pad = { top: 12, right: 12, bottom: 28, left: 52 };
      const unlevered = [];
      const levered = [];
      let cumU = 0;
      let cumL = 0;
      cashFlows.forEach((row) => {
        cumU += row.netCashFlow;
        cumL += row.leveredNetCashFlow;
        unlevered.push({ year: row.year, value: cumU });
        levered.push({ year: row.year, value: cumL });
      });
      const series = showFinancing
        ? [{ data: unlevered, color: '#4A5560', label: 'Unlevered' }, { data: levered, color: '#1A6B66', label: 'Levered' }]
        : [{ data: unlevered, color: '#1A6B66', label: 'Cumulative' }];
      const allVals = series.flatMap((s) => s.data.map((d) => d.value));
      const minY = Math.min(0, ...allVals);
      const maxY = Math.max(0, ...allVals);
      const range = maxY - minY || 1;
      const minX = cashFlows[0].year;
      const maxX = cashFlows[cashFlows.length - 1].year;
      const xScale = (year) => pad.left + ((year - minX) / (maxX - minX || 1)) * (width - pad.left - pad.right);
      const yScale = (val) => height - pad.bottom - ((val - minY) / range) * (height - pad.top - pad.bottom);

      return (
        <div className="space-y-2">
          <div className="flex flex-wrap gap-3 text-[10px] text-stone-500">
            {series.map((s) => (
              <span key={s.label} className="inline-flex items-center gap-1">
                <span className="inline-block w-3 h-0.5 rounded" style={{ backgroundColor: s.color }} />
                {s.label}
              </span>
            ))}
          </div>
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-lg" role="img" aria-label="Cumulative cash flow over project horizon">
            <line x1={pad.left} y1={yScale(0)} x2={width - pad.right} y2={yScale(0)} className="stroke-stone-200" strokeWidth="1" />
            {series.map((s) => (
              <polyline
                key={s.label}
                fill="none"
                stroke={s.color}
                strokeWidth="2"
                points={s.data.map((d) => `${xScale(d.year)},${yScale(d.value)}`).join(' ')}
              />
            ))}
            <text x={width / 2} y={height - 4} textAnchor="middle" className="fill-stone-400 text-[9px]">Project year</text>
          </svg>
          <p className="text-[10px] text-stone-400">Cumulative net cash flow. Payback is roughly where the line crosses zero.</p>
        </div>
      );
    }

    function SensitivityTornadoChart({ data, formatPercent, formatCurrency }) {
      const { baseValue, rows, metric } = data;
      if (baseValue == null || !rows.length) {
        return <p className="text-xs text-stone-500">Sensitivity chart needs revenue and a solvable IRR or NPV at the current inputs.</p>;
      }

      const formatMetric = (val) => (metric === 'npv' ? formatCurrency(val) : formatPercent(val));
      const width = 480;
      const rowHeight = 30;
      const pad = { top: 16, right: 16, bottom: 28, left: 118 };
      const height = pad.top + rows.length * rowHeight + pad.bottom;
      const allVals = rows.flatMap((row) => [row.low, row.high, baseValue]);
      const minVal = Math.min(...allVals);
      const maxVal = Math.max(...allVals);
      const range = maxVal - minVal || (metric === 'npv' ? 1e6 : 0.01);
      const domainMin = minVal - range * 0.08;
      const domainMax = maxVal + range * 0.08;
      const xScale = (val) => pad.left + ((val - domainMin) / (domainMax - domainMin)) * (width - pad.left - pad.right);
      const baseX = xScale(baseValue);

      return (
        <div className="space-y-2">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-lg" role="img" aria-label="Sensitivity tornado chart">
            <line x1={baseX} y1={pad.top - 4} x2={baseX} y2={height - pad.bottom} stroke="#a8a29e" strokeWidth="1" strokeDasharray="3 3" />
            <text x={baseX} y={12} textAnchor="middle" className="fill-stone-500 text-[9px] font-mono">Base {formatMetric(baseValue)}</text>
            {rows.map((row, index) => {
              const y = pad.top + index * rowHeight + rowHeight / 2;
              const xLow = xScale(Math.min(row.low, row.high));
              const xHigh = xScale(Math.max(row.low, row.high));
              const barColor = row.low < baseValue && row.high < baseValue ? '#b91c1c' : row.low > baseValue && row.high > baseValue ? '#145552' : '#1A6B66';
              return (
                <g key={row.key}>
                  <text x={pad.left - 8} y={y + 3} textAnchor="end" className="fill-stone-600 text-[9px]">{row.label}</text>
                  <rect x={xLow} y={y - 8} width={Math.max(xHigh - xLow, 2)} height={16} fill={barColor} fillOpacity="0.35" stroke={barColor} strokeWidth="1" rx="2" />
                  <text x={xLow - 4} y={y + 3} textAnchor="end" className="fill-stone-500 text-[8px] font-mono">{formatMetric(row.low)}</text>
                  <text x={xHigh + 4} y={y + 3} textAnchor="start" className="fill-stone-500 text-[8px] font-mono">{formatMetric(row.high)}</text>
                  <text x={pad.left - 8} y={y + 13} textAnchor="end" className="fill-stone-400 text-[7px]">{row.lowNote} / {row.highNote}</text>
                </g>
              );
            })}
          </svg>
          <p className="text-[10px] text-stone-400">Each bar spans the low and high scenario for one input; wider bars move the metric more. One input changes at a time.</p>
        </div>
      );
    }

    function CollapsibleSection({ title, children, defaultOpen = false }) {

    function ElectricityLineChart({ data, sourceLabel, sourceUrl, sourceNote, covidYear, covidLabel }) {
      const width = 520;
      const height = 220;
      const pad = { top: 28, right: 14, bottom: 30, left: 46 };
      const values = data.map((d) => d.billionKWh);
      const dataMin = Math.min(...values);
      const dataMax = Math.max(...values);
      const padY = Math.max(40, Math.round((dataMax - dataMin) * 0.12));
      const minY = Math.floor((dataMin - padY) / 50) * 50;
      const maxY = Math.ceil((dataMax + padY) / 50) * 50;
      const minX = data[0].year;
      const maxX = data[data.length - 1].year;
      const xScale = (year) => pad.left + ((year - minX) / (maxX - minX)) * (width - pad.left - pad.right);
      const yScale = (val) => height - pad.bottom - ((val - minY) / (maxY - minY)) * (height - pad.top - pad.bottom);
      const points = data.map((d) => `${xScale(d.year)},${yScale(d.billionKWh)}`).join(' ');
      const yTickStep = maxY - minY > 600 ? 200 : 100;
      const yTicks = [];
      for (let tick = minY; tick <= maxY; tick += yTickStep) yTicks.push(tick);
      const xTicks = data.filter((d, i) => i === 0 || i === data.length - 1 || d.year % 5 === 0);
      const covidPoint = covidYear != null ? data.find((d) => d.year === covidYear) : null;

      return (
        <div className="space-y-2">
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-xl" role="img" aria-label={`US retail electricity sales ${minX} to ${maxX}`}>
            {yTicks.map((tick) => (
              <g key={tick}>
                <line x1={pad.left} y1={yScale(tick)} x2={width - pad.right} y2={yScale(tick)} stroke="#e7e5e4" strokeWidth="1" />
                <text x={pad.left - 6} y={yScale(tick) + 3} textAnchor="end" className="fill-stone-400 text-[9px] font-mono">{tick}</text>
              </g>
            ))}
            {covidPoint && (
              <g>
                <line
                  x1={xScale(covidPoint.year)}
                  y1={pad.top}
                  x2={xScale(covidPoint.year)}
                  y2={height - pad.bottom}
                  stroke="#78716c"
                  strokeWidth="1"
                  strokeDasharray="3 3"
                />
                <circle cx={xScale(covidPoint.year)} cy={yScale(covidPoint.billionKWh)} r="4.5" fill="#fff" stroke="#161D22" strokeWidth="1.5" />
                <text
                  x={xScale(covidPoint.year)}
                  y={pad.top - 8}
                  textAnchor={covidPoint.year > (minX + maxX) / 2 ? 'end' : 'start'}
                  className="fill-stone-600 text-[9px] font-semibold"
                >
                  {covidLabel || `${covidYear} · COVID`}
                </text>
              </g>
            )}
            <polyline fill="none" stroke="#1A6B66" strokeWidth="2.25" points={points} />
            {data.map((d) => (
              <circle
                key={d.year}
                cx={xScale(d.year)}
                cy={yScale(d.billionKWh)}
                r={d.year === covidYear ? 0 : 2.75}
                fill="#1A6B66"
              />
            ))}
            {xTicks.map((d) => (
              <text key={d.year} x={xScale(d.year)} y={height - 8} textAnchor="middle" className="fill-stone-500 text-[9px] font-mono">{d.year}</text>
            ))}
            <text x={width / 2} y={height} textAnchor="middle" className="fill-stone-400 text-[9px]">Year</text>
            <text x={10} y={height / 2} textAnchor="middle" transform={`rotate(-90 10 ${height / 2})`} className="fill-stone-400 text-[9px]">Billion kWh</text>
          </svg>
          <p className="text-[10px] text-stone-400 leading-relaxed">
            US retail electricity sales ({minX}–{maxX}). Growth was relatively flat for much of the 2010s after the 2000s climb; the marked 2020 dip partly reflects COVID-era closures and slower business activity (commercial and industrial sales fell; residential rose slightly). Y-axis is padded around the series, not zero.{' '}
            {sourceNote ? `${sourceNote} ` : null}
            <a href={sourceUrl} target="_blank" rel="noopener noreferrer" className="underline hover:text-stone-600">{sourceLabel}</a>
          </p>
        </div>
      );
    }

      const facilityTypeEnergy = useMemo(() => {

        const disclosureLabel = ab1577Results.isTriggered ? 'Monthly reporting' : 'No reporting';

        } else if (ceqaResults.timelineMonths === 12) {
          narrative = 'At or above 25 MW, the developer pays the full modeled grid upgrade cost. Permitting follows the faster modeled path when cooling, clean power, and size align.';
        } else {
          narrative = 'At or above 25 MW, the developer pays the full modeled grid upgrade cost. Monthly disclosure also applies.';
        }
        return { disclosureLabel, narrative };
      }, [megawatts, ab1577Results.isTriggered, ceqaResults.timelineMonths]);

      useEffect(() => {
        return () => {
          if (demoFlashTimerRef.current) clearTimeout(demoFlashTimerRef.current);

      }, []);

      useEffect(() => {
        const presetId = activeFacilityType?.id || (stressTestActive ? 'stress' : null);
        const next = buildScenarioSearch({
          tab: activeTab,
          mw: megawatts,
          utility: utilityCode,
          cooling: coolingType,
          clean: prefundCleanEnergy,

      useEffect(() => {
        if (activeTab !== 'plan') {

          setScorecardForceExpanded(false);

        const el = scorecardSentinelRef.current;
        if (!el || typeof IntersectionObserver === 'undefined') return undefined;

        let observer = null;
        const connect = () => {
          if (observer) observer.disconnect();
          observer = new IntersectionObserver(
            ([entry]) => {
              // Compact only after real scroll — avoids load-time compact when sentinel is below the fold.
              if (!entry.isIntersecting && window.scrollY > 40) {
                setScorecardPastSentinel(true);
                return;
              }
              // Expand only near page top — avoids flicker when sticky height shrinks and pulls the sentinel back into view.
              if (entry.isIntersecting && window.scrollY < 120) {
                setScorecardPastSentinel(false);
                setScorecardForceExpanded(false);
              }
            },
            { root: null, rootMargin: '0px', threshold: 0 }
          );
          observer.observe(el);
        };
        connect();
        return () => {
          if (observer) observer.disconnect();
        };
      }, [activeTab]);

      const tabs = [
        { id: 'plan', label: 'Plan a site' },

                          </p>

                    </p>

                >
                  Run demo
                </button>

              >
                <summary className="cursor-pointer list-none flex flex-wrap items-center justify-between gap-2 px-4 py-3 select-none">

                  <select
                    value={methodologyExample}
                    onChange={(e) => setMethodologyExample(e.target.value)}
                    className="mt-1 w-full bg-white border border-stone-300 rounded-md p-2 text-sm text-stone-800"
                  >
                    <option value="current">Current inputs from Plan a site</option>
                    <option value="30mw-pge">30 MW, PG&E, closed-loop air, clean power on</option>
                  </select>
                </label>
                <p className="text-xs text-stone-500">Select an example to see each calculation step with numbers filled in.</p>
                {workedExample.map((block) => (
                  <div key={block.label} className="border-t border-stone-100 pt-3 first:border-0 first:pt-0">
                    <h4 className="text-xs font-semibold uppercase tracking-wide text-stone-500 mb-2">{block.label}</h4>
                    <ul className="text-sm text-stone-600 space-y-1 list-disc pl-5">
                      {block.lines.map((line) => <li key={line}>{line}</li>)}
                    </ul>
                  </div>
                ))}
              </section>

              <CollapsibleSection title="Formulas and assumptions">
                <section id="how-formulas" className="space-y-2 scroll-mt-4">
                  <div className="flex flex-wrap gap-2 mb-2">
                    <EvidenceBadge level="strong" />
                    <EvidenceBadge level="moderate" />
                    <EvidenceBadge level="weak" />
                    <EvidenceBadge level="speculative" />
                  </div>
                  <div className="flex items-center gap-2"><StatusBadge status="modeled" /><h4 className="font-semibold text-stone-900 text-sm">Grid upgrade allocation (SB 886 style)</h4></div>
                  <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                    <li><strong>Threshold:</strong> At 25 MW and above, developer pays 100% of modeled upgrade cost.</li>
                    <li><strong>Upgrade cost:</strong> <code className="text-xs bg-stone-100 px-1 rounded">MW x utility $/MW</code>. PG&E $250k, SDG&E $410k, SCE $180k per MW (illustrative placeholders).</li>
                    <li><strong>Below 25 MW:</strong> Developer 75%; residual 25% to other customers / rate base (class split not modeled).</li>
                    <li><strong>Clean energy:</strong> At 25 MW and above, annual = <code className="text-xs bg-stone-100 px-1 rounded">MW x 50% x $75,000</code>, x 15 years.</li>
                  </ul>
                  <div className="flex items-center gap-2 pt-2"><StatusBadge status="modeled" /><h4 className="font-semibold text-stone-900 text-sm">CEQA timeline (SB 887 style)</h4></div>
                  <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                    <li><strong>Baseline:</strong> 36 months (modeled standard path).</li>
                    <li><strong>12 months:</strong> Modeled fast path when cooling avoids open-loop water, clean power is on, and MW is at least 25.</li>
                    <li><strong>48 months:</strong> Baseline plus 12 for open-loop evaporative cooling.</li>
                  </ul>
                  <div className="flex items-center gap-2 pt-2"><StatusBadge status="modeled" /><h4 className="font-semibold text-stone-900 text-sm">Disclosure (AB 1577 style)</h4></div>
                  <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                    <li><strong>Threshold:</strong> 500 kW (0.5 MW).</li>
                    <li><strong>Above threshold:</strong> Modeled monthly PUE, waste heat, and backup emissions reporting.</li>
                  </ul>
                  <h4 className="font-semibold text-stone-900 text-sm pt-2">Facility economics formulas</h4>
                  <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                    <li><code className="text-xs bg-stone-100 px-1 rounded">CapEx = MW x build cost per MW</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Annual MWh = MW x 8,760 x load factor x PUE</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Annual energy $ = Annual MWh x $/MWh</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Annual opex = MW x $/MW-year</code> (staffing, maintenance)</li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Clean-energy PPA = MW x 50% x $75k</code> at 25 MW and above (SB 886 scenario)</li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Permitting delay carry = (CapEx + grid) x rate x (months past 12 / 12)</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Colo revenue = online MW x occupancy x 1,000 x $/kW/month x 12</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">CapEx spent evenly over construction years; MW online ramps with build</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Occupancy ramps linearly over lease-up years from first energization</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Permitting months delay when construction and revenue start</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Payback (schedule) = first year cumulative net cash flow turns positive</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Debt service = PMT(rate, term, principal)</code> on debt share of upfront, starting when construction completes</li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">Levered CF = unlevered CF + loan proceeds - debt service</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">DSCR = (revenue - operating cost) / debt service</code></li>
                    <li><code className="text-xs bg-stone-100 px-1 rounded">NPV = Σ CF_t / (1 + discount)^t</code>; IRR solves NPV(rate) = 0</li>
                    <li><strong>Sensitivity:</strong> one input perturbed low/high at a time; tornado bar width = impact on IRR or NPV</li>
                  </ul>
                </section>
              </CollapsibleSection>

              <section className="bg-white border border-fog-200 rounded-md p-4 space-y-2">
                <h3 className="font-semibold text-stone-900 text-sm">Model assumptions</h3>
                <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                  {baselines.modelAssumptions.map((assumption) => (
                    <li key={assumption}>{assumption}</li>
                  ))}
                </ul>
              </section>

              <section className="bg-white border border-fog-200 rounded-md p-4 space-y-2">
                <h3 className="font-semibold text-stone-900 text-sm">Known limitations</h3>
                <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                  <li>No site-specific substation or geography inputs.</li>
                  <li>Load factor applies on facility economics only, not the policy scenario cards.</li>
                  <li>Utility cost placeholders are not from interconnection studies.</li>
                  <li>CEQA and utility processes are separate in practice but linked here for comparison.</li>
                </ul>
              </section>

              <section className="bg-white border border-fog-200 rounded-md p-4 space-y-2">
                <h3 className="font-semibold text-stone-900 text-sm">Source links</h3>
                <ul className="text-sm text-stone-600 space-y-1.5 list-disc pl-5">
                  {baselines.metadata.sources.map((source) => (
                    <li key={source.url}>
                      <a href={source.url} target="_blank" rel="noopener noreferrer" className="underline text-stone-700 hover:text-stone-900">{source.label}</a>
                    </li>
                  ))}
                  <li>
                    <a href={baselines.industryContext.synergyResearchUrl} target="_blank" rel="noopener noreferrer" className="underline text-stone-700 hover:text-stone-900">{baselines.industryContext.synergyResearchLabel}</a>
                  </li>
                  <li>
                    <a href={baselines.usElectricity.sourceUrl} target="_blank" rel="noopener noreferrer" className="underline text-stone-700 hover:text-stone-900">{baselines.usElectricity.sourceLabel}</a>
                  </li>
                </ul>
              </section>
              </div>
            </main>
          )}

          <footer className="no-print mt-auto border-t border-fog-200 bg-white py-6 text-center text-xs text-fog-700 space-y-1.5">
            <p className="text-asphalt-900 font-medium">{baselines.metadata.appTitle} · Updated {baselines.metadata.lastUpdated}</p>
            <p>
              Built by {baselines.metadata.authorName} ·{' '}
              <a href={baselines.metadata.repoUrl} target="_blank" rel="noopener noreferrer" className="underline text-fog-700 hover:text-asphalt-900">View source on GitHub</a>
            </p>
            <p className="text-[10px] text-fog-700 max-w-2xl mx-auto leading-relaxed px-4">
              {baselines.metadata.topBarBriefing} <strong>{baselines.metadata.disclaimer}</strong>
            </p>
            <p className="text-[10px] text-fog-700">Not affiliated with PG&E, SCE, SDG&E, CPUC, CEC, or CAISO. Illustrative outputs only.</p>
            <p className="text-[10px] text-fog-700">
              Photo credits: see <a href="media/SOURCES.md" className="underline hover:text-asphalt-900">media/SOURCES.md</a>
            </p>
          </footer>
        </div>
      );
    }

    function mountApp() {
      try {
        if (typeof React === 'undefined') throw new Error('React is not available.');
        if (typeof ReactDOM === 'undefined') throw new Error('ReactDOM is not available.');
        if (typeof App !== 'function') throw new Error('App failed to compile. Check the browser console.');
        const container = document.getElementById('root');
        if (!container) throw new Error('Root element #root not found.');
        ReactDOM.createRoot(container).render(<App />);
      } catch (error) {
        console.error(error);
        if (typeof window.__showLoadError === 'function') window.__showLoadError(error.message || String(error));
      }
    }

    mountApp();
  </script>
</body>
</html>
